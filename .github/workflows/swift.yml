name: Swift

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v4

    - name: Get version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "is_release=true" >> $GITHUB_OUTPUT
        else
          echo "version=dev" >> $GITHUB_OUTPUT
          echo "is_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Test browser integration
      working-directory: browser
      run: |
        npm ci
        npm test
        npm run check:userscript

    - name: Test mcp-ghpr bundle
      run: |
        cd mcp-ghpr
        npm ci
        npm test
        node scripts/generate-notice.mjs --check
        git diff --exit-code -- ../mcp-ghpr-bundle/index.mjs ../NOTICE

    - name: Install Playwright browsers
      working-directory: browser
      run: npx playwright install chromium

    - name: Run browser e2e (Playwright/Chromium)
      working-directory: browser
      run: npm run test:e2e

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          browser/playwright-report
          browser/test-results
        if-no-files-found: ignore

    - name: Test Swift unit suite
      run: |
        xcodebuild \
          -project PRDashboard.xcodeproj \
          -scheme PRDashboard \
          -configuration UITesting \
          -sdk macosx \
          -arch arm64 \
          -derivedDataPath "$RUNNER_TEMP/ghpr-tests" \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=YES \
          CODE_SIGNING_ALLOWED=YES \
          -only-testing:PRDashboardTests \
          test

    - name: Test Swift UI suite
      run: |
        xcodebuild \
          -project PRDashboard.xcodeproj \
          -scheme PRDashboard \
          -configuration UITesting \
          -sdk macosx \
          -arch arm64 \
          -derivedDataPath "$RUNNER_TEMP/ghpr-tests" \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=YES \
          CODE_SIGNING_ALLOWED=YES \
          -only-testing:PRDashboardUITests \
          test

    - name: Upload Swift test results (screenshots on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: swift-test-results
        path: ${{ runner.temp }}/ghpr-tests/Logs/Test/*.xcresult
        if-no-files-found: ignore

    - name: Build
      run: |
        EXTRA_ARGS=()
        if [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
          EXTRA_ARGS+=("MARKETING_VERSION=${{ steps.version.outputs.version }}")
        fi

        xcodebuild \
          -project PRDashboard.xcodeproj \
          -scheme PRDashboard \
          -configuration Release \
          -sdk macosx \
          -arch arm64 \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=YES \
          CODE_SIGNING_ALLOWED=YES \
          "${EXTRA_ARGS[@]}" \
          build

    - name: Pin designated requirement
      run: |
        APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData/PRDashboard-*/Build/Products/Release \
          -maxdepth 2 -name 'PRDashboard.app' -type d | head -1)"
        if [ -z "$APP_PATH" ]; then
          echo "Error: PRDashboard.app not found"
          exit 1
        fi
        # Ship the license with the app. The zip below is a build output and is not committed.
        cp "$GITHUB_WORKSPACE/LICENSE" "$APP_PATH/Contents/Resources/LICENSE"
        cp "$GITHUB_WORKSPACE/NOTICE" "$APP_PATH/Contents/Resources/NOTICE"
        test -s "$APP_PATH/Contents/Resources/LICENSE"
        test -s "$APP_PATH/Contents/Resources/NOTICE"
        REQ_FILE="$(mktemp)"
        echo 'designated => identifier "com.xiaocang.PRDashboard"' > "$REQ_FILE"
        codesign --force --sign - \
          --identifier com.xiaocang.PRDashboard \
          --requirements "$REQ_FILE" \
          --timestamp=none \
          "$APP_PATH"
        rm -f "$REQ_FILE"
        codesign --verify --strict "$APP_PATH"
        codesign -d -r- "$APP_PATH"

    - name: Create Release Artifact
      run: |
        cd ~/Library/Developer/Xcode/DerivedData/PRDashboard-*/Build/Products/Release
        zip -r "$GITHUB_WORKSPACE/PRDashboard-${{ steps.version.outputs.version }}.zip" PRDashboard.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PRDashboard-${{ steps.version.outputs.version }}
        path: PRDashboard-${{ steps.version.outputs.version }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Get version from tag
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Download release zip
      uses: actions/download-artifact@v4
      with:
        name: PRDashboard-${{ steps.version.outputs.version }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: PRDashboard-${{ steps.version.outputs.version }}.zip
        generate_release_notes: true

    - name: Publish release package
      uses: softprops/action-gh-release@v2
      with:
        repository: xiaocang/ghpr-view
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        tag_name: ${{ github.ref_name }}
        target_commitish: main
        name: ${{ github.ref_name }}
        body: PR Dashboard ${{ steps.version.outputs.version }}
        files: PRDashboard-${{ steps.version.outputs.version }}.zip
        fail_on_unmatched_files: true

    - name: Update Homebrew Tap
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Calculate SHA256 of the release zip
        SHA256=$(shasum -a 256 PRDashboard-${VERSION}.zip | awk '{print $1}')
        echo "SHA256: $SHA256"

        # Clone homebrew-tap repo
        git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/xiaocang/homebrew-tap.git /tmp/homebrew-tap
        cd /tmp/homebrew-tap

        current=$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' Casks/prdashboard.rb | head -1)
        smallest=$(printf '%s\n%s\n' "$VERSION" "$current" | sort -t. -k1,1n -k2,2n -k3,3n | head -1)
        if [ -n "$current" ] && [ "$VERSION" != "$current" ] && [ "$smallest" = "$VERSION" ]; then
          echo "Skip Homebrew downgrade from ${current} to ${VERSION}"
          exit 0
        fi

        # Update the cask file
        sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/prdashboard.rb
        sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/prdashboard.rb

        # Commit and push. An unchanged cask must not fail the release.
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Casks/prdashboard.rb
        if git diff --cached --quiet; then
          echo "Homebrew cask already matches ${VERSION}"
          exit 0
        fi
        git commit -m "Update prdashboard to ${VERSION}"
        branch=$(git rev-parse --abbrev-ref HEAD)
        git pull --rebase origin "$branch"
        git push
